<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클립메모 웹 뷰어</title>
<meta name="description" content="내 구글 드라이브의 클립메모 메모를 브라우저에서 읽기 전용으로 봅니다">
<link rel="icon" href="../logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4B3FD9">
<style>
  :root {
    --ink:#171A1F; --muted:#5B636E; --subtle:#8A929D; --canvas:#E9EBEF; --surface:#FFFFFF;
    --line:#D3D7DE; --signal:#4B3FD9; --signal-soft:rgba(75,63,217,.10); --danger:#C2412D;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:#F2F4F7; --muted:#9AA2AE; --subtle:#6F7884; --canvas:#14171C; --surface:#1E222A;
      --line:#2F343D; --signal:#7B71F2; --signal-soft:rgba(123,113,242,.16); --danger:#F08A78;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--canvas); color:var(--ink); line-height:1.55;
         font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif; }
  a { color:var(--signal); }
  button { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  /* 머리 줄 */
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--surface);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:17px; white-space:nowrap; }
  header .brand img { width:28px; height:28px; border-radius:8px; }
  header .brand small { font-weight:500; color:var(--subtle); font-size:12px; }
  #search { flex:1; min-width:0; max-width:520px; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
            background:var(--canvas); color:var(--ink); font:inherit; }
  #search:focus { outline:2px solid var(--signal); outline-offset:-1px; }
  .account { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .ghost { background:none; border:1px solid var(--line); border-radius:10px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .ghost:hover { border-color:var(--signal); }
  .primary { background:var(--signal); color:#fff; border:0; border-radius:12px; padding:12px 20px; font-weight:700; cursor:pointer; }

  /* 로그인 전 */
  #welcome { max-width:560px; margin:56px auto; padding:0 16px; text-align:center; }
  #welcome img { width:72px; height:72px; border-radius:18px; }
  #welcome h1 { font-size:26px; margin:16px 0 8px; letter-spacing:-.5px; }
  #welcome p { color:var(--muted); }
  #welcome .fine { font-size:13px; color:var(--subtle); margin-top:24px; }

  /* 본문 3단 */
  #app { display:grid; grid-template-columns:200px 340px 1fr; height:calc(100vh - 57px); }
  nav { border-right:1px solid var(--line); padding:12px 8px; overflow:auto; }
  nav .sec { display:flex; justify-content:space-between; align-items:center; width:100%; padding:8px 10px;
             border:0; background:none; border-radius:10px; cursor:pointer; text-align:left; }
  nav .sec:hover { background:var(--signal-soft); }
  nav .sec.on { background:var(--signal-soft); color:var(--signal); font-weight:700; }
  nav .sec span:last-child { color:var(--subtle); font-size:12px; }
  nav h3 { font-size:12px; color:var(--subtle); margin:16px 10px 4px; font-weight:600; }
  #list { border-right:1px solid var(--line); overflow:auto; padding:10px; }
  #list .empty, #detail .empty { color:var(--subtle); text-align:center; margin-top:48px; }
  .card { display:block; width:100%; text-align:left; border:1px solid transparent; border-radius:14px; padding:12px 14px;
          margin-bottom:8px; cursor:pointer; color:var(--card-ink); background:var(--card-bg); }
  .card.on { border-color:var(--signal); box-shadow:0 0 0 1px var(--signal); }
  .card b { display:block; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card p { margin:4px 0 0; font-size:13px; opacity:.75; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { font-size:11px; opacity:.6; margin-top:6px; display:flex; gap:8px; flex-wrap:wrap; }
  #detail { overflow:auto; padding:24px 32px 64px; }
  #detail article { max-width:760px; margin:0 auto; background:var(--note-bg); color:var(--note-ink);
                    border-radius:18px; padding:24px 28px 32px; }
  #detail h1.title { font-size:24px; margin:0 0 6px; letter-spacing:-.4px; color:var(--title-ink, inherit); }
  #detail .meta { font-size:12px; opacity:.65; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:6px 12px; }
  .chip { display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px; background:rgba(127,127,127,.16); }
  .body { font-size:15.5px; word-break:break-word; }
  .body img { max-width:100%; border-radius:10px; display:block; margin:8px 0; }
  .body pre { background:rgba(127,127,127,.14); padding:10px 12px; border-radius:8px; overflow:auto; }
  .body code { background:rgba(127,127,127,.14); padding:1px 5px; border-radius:5px; }
  .body pre code { background:none; padding:0; }
  .body blockquote { margin:8px 0; padding-left:12px; border-left:3px solid rgba(127,127,127,.4); opacity:.85; }
  .checklist { list-style:none; padding:0; margin:14px 0 0; }
  .checklist li { padding:4px 0; display:flex; gap:8px; }
  .checklist li.done span:last-child { text-decoration:line-through; opacity:.55; }
  .photos { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .photos img { width:140px; height:140px; object-fit:cover; border-radius:10px; cursor:zoom-in; }
  .files { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .files button { text-align:left; background:rgba(127,127,127,.12); border:0; border-radius:10px; padding:8px 12px; cursor:pointer; }
  .locked { text-align:center; padding:32px 8px; }
  .locked div { font-size:40px; }
  .ph { background:rgba(127,127,127,.15); border-radius:10px; min-height:120px; }
  #status { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--canvas);
            padding:10px 16px; border-radius:12px; font-size:14px; z-index:20; max-width:calc(100% - 32px); }
  #back { display:none; }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:30; cursor:zoom-out; }
  #zoom img { max-width:96vw; max-height:92vh; border-radius:8px; }

  /* 폰 — 목록 ↔ 메모 한 화면씩 */
  @media (max-width: 860px) {
    header { flex-wrap:wrap; }
    header .brand small { display:none; }
    #search { order:3; flex-basis:100%; max-width:none; }
    #app { grid-template-columns:1fr; height:auto; }
    nav { border-right:0; border-bottom:1px solid var(--line); display:flex; gap:6px; overflow-x:auto; padding:8px 12px; scrollbar-width:none; }
    nav::-webkit-scrollbar { display:none; }
    nav h3 { display:none; }
    nav .sec { width:auto; white-space:nowrap; gap:6px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; }
    #list { border-right:0; padding:12px 16px; }
    #detail { padding:12px 16px 48px; }
    #detail article { padding:18px 18px 24px; }
    body.reading nav, body.reading #list { display:none; }
    body:not(.reading) #detail { display:none; }
    body.reading #back { display:inline-block; margin-bottom:10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><img src="../logo.png" alt=""><span>클립메모</span><small>웹 뷰어 · 읽기 전용</small></div>
  <input id="search" type="search" placeholder="제목·본문·체크리스트·태그 검색" autocomplete="off" class="hidden">
  <div class="account">
    <span id="who" class="hidden"></span>
    <button id="reload" class="ghost hidden" title="드라이브에서 다시 불러오기">새로 고침</button>
    <button id="signout" class="ghost hidden">로그아웃</button>
  </div>
</header>

<section id="welcome">
  <img src="../logo.png" alt="클립메모 로고">
  <h1>메모를 브라우저에서 보기</h1>
  <p>클립메모 앱과 같은 구글 계정으로 로그인하면, 내 구글 드라이브 '클립메모' 폴더의 메모를 읽기 전용으로 볼 수 있어요.</p>
  <p><button id="signin" class="primary">구글 계정으로 로그인</button></p>
  <p id="notReady" class="hidden">웹 뷰어를 준비하고 있어요. 조금만 기다려 주세요.</p>
  <p class="fine">메모는 이 브라우저와 구글 드라이브 사이에서만 오가며 다른 곳으로 보내지지 않습니다. 이 창을 닫으면 브라우저에 남지 않아요.
    잠긴 메모와 일기는 앱에서만 열 수 있어요. · <a href="../privacy.html">개인정보처리방침</a></p>
</section>

<div id="app" class="hidden">
  <nav id="nav"></nav>
  <section id="list"></section>
  <section id="detail"><button id="back" class="ghost">← 목록</button><div id="detailBody"><p class="empty">메모를 고르세요</p></div></section>
</div>

<div id="status" class="hidden"></div>
<div id="zoom" class="hidden"><img alt=""></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
